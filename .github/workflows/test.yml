name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # The suite shells out to git constantly — worktrees, merge previews, ownership checks — and
    # the path and link semantics it depends on differ per platform. A Windows-only or Linux-only
    # run would miss the class of bug this project has already hit twice: junctions versus
    # symlinks, and drive-relative paths.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No install step: zero runtime and zero dev dependencies, by constraint.
      - name: Configure git identity
        # Tests create commits in temporary repositories; git refuses without an identity.
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "CI"
      - name: Lint shipped instructions
        run: node scripts/security-lint.mjs --root .
      - run: npm test
      # The hostile-TMPDIR sweep, which the normal suite deliberately does not carry: it runs the
      # whole suite a second time, and what it measures is the environment crossed with the code.
      # Not on Windows — TMPDIR is not how it chooses a temp directory and cmd.exe expands no
      # `$( )`, so the leg would report a clean run it never measured. The script refuses there
      # too; this condition keeps the wasted minutes out of CI as well.
      - name: Hostile-TMPDIR sweep
        if: runner.os != 'Windows'
        run: npm run test:hostile-tmpdir
