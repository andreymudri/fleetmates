name: deck

on:
  push:
    branches: [master]
  pull_request:

jobs:
  hub:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Every step runs on all three runners, in each runner's default shell (pwsh on Windows).
    # Windows: TMPDIR=/tmp/hx resolves on the current drive, and the prepare step records its
    # realpath, a drive path. Node documents that os.tmpdir() on Windows reads TEMP and TMP, not
    # TMPDIR, and no hub source or test reads TMPDIR itself. TEMP there is the 8.3 short name C:\Users\RUNNER~1\...,
    # so `npm --prefix hub test` preloads hub/test/helpers/canonical-tmp.mjs, which points TEMP and TMP at its long
    # name. The browser tests find Chrome from the runner image under
    # %ProgramFiles% (hub/test/helpers/chromium.mjs). The regression check stays on Windows: four
    # of the tests it names are POSIX only and skip there with a reason; the other two (the HTTP
    # body limits) run, as they do in the full suite.
    env:
      TMPDIR: /tmp/hx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: hub/.node-version
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Prepare canonical temporary directory
        run: node -e 'const fs = require("node:fs"); fs.mkdirSync(process.env.TMPDIR, {recursive:true}); fs.appendFileSync(process.env.GITHUB_ENV, `TMPDIR=${fs.realpathSync(process.env.TMPDIR)}\n`)'
      - run: npm ci --prefix hub
      - run: npm --prefix hub run build
      - name: Check platform regressions before the full suite
        run: node --test --test-name-pattern='null-device timestamps|JSON body type|oversized streamed|confirmed read stays|confirming read starts|renamed Node init' hub/test/unit/tiers.test.mjs hub/test/integration/security.test.mjs hub/test/unit/http-body-limit.test.mjs hub/test/unit/setup.test.mjs
      - run: npm --prefix hub test
